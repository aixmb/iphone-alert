<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iPhone Alert">
<title>iPhone Alert</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e;
  --border: rgba(255,255,255,0.1); --accent: #e8ff47;
  --text: #f0f0f0; --muted: #888; --green: #30d158;
  --red: #ff453a; --orange: #ff9f0a;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; }

/* Header */
.hdr { background: var(--bg); padding: env(safe-area-inset-top,44px) 20px 0; flex-shrink: 0; }
.hdr-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; border-bottom: 0.5px solid var(--border); }
.logo { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
.logo span { color: var(--accent); }
.sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.hdr-btns { display: flex; gap: 8px; }
.ibtn { width: 38px; height: 38px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

/* Location */
.loc { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
.loc-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); flex: 1; }
.loc-text b { color: var(--text); }
.loc-btn { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); background: none; border: 0.5px solid rgba(232,255,71,.3); border-radius: 6px; padding: 4px 8px; cursor: pointer; }

/* Filters */
.filters { display: flex; gap: 6px; padding: 10px 0 12px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.filters::-webkit-scrollbar { display: none; }
.pill { font-family: 'DM Mono', monospace; font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface); color: var(--muted); white-space: nowrap; cursor: pointer; }
.pill.on { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 500; }

/* Feed */
.feed { flex: 1; overflow-y: auto; padding: 0 20px 20px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.sec { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.sec::after { content: ''; flex: 1; height: .5px; background: var(--border); }

/* Card */
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; margin-bottom: 10px; overflow: hidden; cursor: pointer; transition: transform .1s; }
.card:active { transform: scale(.98); }
.card.new { border-color: rgba(232,255,71,.35); }
.card.new::before { content: ''; display: block; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }
.card-inner { display: flex; }
.card-img { width: 84px; min-height: 84px; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; font-size: 36px; }
.nbadge { position: absolute; top: 5px; left: 5px; background: var(--accent); color: #000; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; padding: 2px 5px; border-radius: 4px; }
.card-body { padding: 11px 12px; flex: 1; min-width: 0; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; margin-bottom: 4px; }
.card-title { font-size: 14px; font-weight: 700; line-height: 1.2; }
.card-price { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--accent); white-space: nowrap; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 5px 0; }
.tag { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 500; }
.tg { background: rgba(48,209,88,.15); color: #30d158; }
.ty { background: rgba(255,159,10,.15); color: #ff9f0a; }
.tr { background: rgba(255,69,58,.15); color: #ff453a; }
.tgr { background: rgba(255,255,255,.07); color: var(--muted); }
.ta { background: rgba(232,255,71,.15); color: var(--accent); }
.card-meta { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
.card-foot { border-top: .5px solid rgba(255,255,255,.06); padding: 7px 12px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

/* Empty */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty div { font-size: 48px; margin-bottom: 14px; }
.empty h3 { font-size: 18px; color: #aaa; margin-bottom: 8px; }
.empty p { font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.7; }

/* Tab bar */
.tabs { display: flex; background: var(--surface); border-top: .5px solid var(--border); padding-bottom: env(safe-area-inset-bottom,20px); flex-shrink: 0; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; cursor: pointer; color: var(--muted); font-size: 9px; font-family: 'DM Mono', monospace; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* Sheet */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s; }
.overlay.open { opacity: 1; pointer-events: all; }
.sheet { background: var(--surface); border-radius: 24px 24px 0 0; width: 100%; padding: 0 20px calc(env(safe-area-inset-bottom,20px) + 20px); max-height: 90dvh; overflow-y: auto; transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1); }
.overlay.open .sheet { transform: translateY(0); }
.handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 20px; }
.sh-title { font-size: 20px; font-weight: 800; margin-bottom: 18px; letter-spacing: -.5px; }

/* Form */
.fg { margin-bottom: 14px; }
.fl { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }
.fi { width: 100%; background: var(--surface2); border: .5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; outline: none; }
.fi:focus { border-color: var(--accent); }
.fi option { background: #1e1e1e; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { width: 100%; background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 14px; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
.btn:active { opacity: .85; }
.btn2 { width: 100%; background: transparent; border: .5px solid var(--border); border-radius: 10px; padding: 12px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 13px; cursor: pointer; margin-top: 8px; }

/* Alert card */
.ac { background: var(--surface2); border: .5px solid rgba(232,255,71,.2); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.ac-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ac-name { font-size: 14px; font-weight: 700; }
.tgl { width: 44px; height: 26px; background: var(--green); border-radius: 13px; position: relative; cursor: pointer; border: none; flex-shrink: 0; transition: background .2s; }
.tgl::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: right .2s; }
.tgl.off { background: var(--surface); border: .5px solid var(--border); }
.tgl.off::after { right: 21px; }
.ac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pc { background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.pk { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; }
.pv { font-family: 'DM Mono', monospace; font-size: 12px; margin-top: 2px; }
.del { width: 100%; background: rgba(255,69,58,.1); border: .5px solid rgba(255,69,58,.3); border-radius: 8px; padding: 8px; color: var(--red); font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; margin-top: 10px; }

/* Toast */
.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom,20px) + 80px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: .5px solid var(--border); border-radius: 24px; padding: 10px 20px; font-family: 'DM Mono', monospace; font-size: 12px; z-index: 200; opacity: 0; transition: all .3s; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Setting row */
.srow { display: flex; align-items: center; padding: 13px 0; border-bottom: .5px solid var(--border); gap: 12px; }
.srow:last-child { border-bottom: none; }
.sico { width: 34px; height: 34px; background: var(--surface2); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
.stxt { flex: 1; }
.sname { font-size: 14px; font-weight: 600; }
.sdesc { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <div class="hdr-row">
      <div>
        <div class="logo">iPhone<span>Alert</span></div>
        <div class="sub"><span class="dot"></span><span id="statusTxt">Gotowy</span></div>
      </div>
      <div class="hdr-btns">
        <div class="ibtn" onclick="refresh()">↻</div>
        <div class="ibtn" onclick="goTab('alerts')">🔔</div>
      </div>
    </div>
    <div class="loc">
      <span style="color:var(--accent)">📍</span>
      <div class="loc-text"><b id="locName">Warszawa</b> &nbsp;·&nbsp; <span id="locRad">±30 km</span></div>
      <button class="loc-btn" onclick="openSheet('alert')">Zmień →</button>
    </div>
    <div class="filters" id="filterRow">
      <span class="pill on" data-f="all">Wszystkie</span>
      <span class="pill" data-f="new">Nowe dziś</span>
      <span class="pill" data-f="perfect">Idealny stan</span>
      <span class="pill" data-f="cheap">Do 2000 zł</span>
      <span class="pill" data-f="15">iPhone 15</span>
      <span class="pill" data-f="14">iPhone 14</span>
    </div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="tabs">
    <div class="tab on" data-tab="feed" onclick="goTab('feed')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Ogłoszenia
    </div>
    <div class="tab" data-tab="alerts" onclick="goTab('alerts')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Alerty
    </div>
    <div class="tab" data-tab="favs" onclick="goTab('favs')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Ulubione
    </div>
    <div class="tab" data-tab="settings" onclick="goTab('settings')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ustawienia
    </div>
  </div>
</div>

<!-- Sheet: New Alert -->
<div class="overlay" id="sheetAlert" onclick="bgClose(event,'alert')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sh-title">Nowy alert 🔔</div>
    <div class="fg">
      <label class="fl">Model iPhone</label>
      <select class="fi" id="aModel">
        <option value="">Wszystkie modele</option>
        <option value="iPhone+16">iPhone 16</option>
        <option value="iPhone+15">iPhone 15</option>
        <option value="iPhone+15+Pro">iPhone 15 Pro</option>
        <option value="iPhone+14">iPhone 14</option>
        <option value="iPhone+13">iPhone 13</option>
        <option value="iPhone+12">iPhone 12</option>
        <option value="iPhone+SE">iPhone SE</option>
      </select>
    </div>
    <div class="fg">
      <label class="fl">Miejscowość</label>
      <input class="fi" id="aCity" type="text" placeholder="np. Warszawa" value="Warszawa">
    </div>
    <div class="frow">
      <div class="fg">
        <label class="fl">Promień (km)</label>
        <select class="fi" id="aRadius">
          <option value="15">15 km</option>
          <option value="30" selected>30 km</option>
          <option value="50">50 km</option>
          <option value="100">100 km</option>
        </select>
      </div>

        <label class="fl">Cena max (zł)</label>
        <input class="fi" id="aPrice" type="number" placeholder="5000" value="5000">
      </div>
    </div>
    <div class="fg">
      <label class="fl">Stan</label>
      <select class="fi" id="aCondition">
        <option value="">Każdy stan</option>
        <option value="new">Nowy</option>
        <option value="perfect">Idealny lub lepszy</option>
        <option value="good">Dobry lub lepszy</option>
      </select>
    </div>
    <div class="fg">
      <label class="fl">Sprawdzaj co</label>
      <select class="fi" id="aInterval">
        <option value="5">5 minut</option>
        <option value="15" selected>15 minut</option>
        <option value="30">30 minut</option>
        <option value="60">1 godzinę</option>
      </select>
    </div>
    <button class="btn" onclick="saveAlert()">Aktywuj alert 🔔</button>
    <button class="btn2" onclick="closeSheet('alert')">Anuluj</button>
  </div>
</div>

<!-- Sheet: Detail -->
<div class="overlay" id="sheetDetail" onclick="bgClose(event,'detail')">
  <div class="sheet">
    <div class="handle"></div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────
var alerts = JSON.parse(localStorage.getItem('ia_alerts') || '[]');
var listings = JSON.parse(localStorage.getItem('ia_listings') || '[]');
var seen = JSON.parse(localStorage.getItem('ia_seen') || '[]');
var favs = JSON.parse(localStorage.getItem('ia_favs') || '[]');
var activeTab = 'feed';
var activeFilter = 'all';
var checking = false;
var pollTimer = null;
var itemMap = {};

// ── Service Worker ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(e){ console.log('SW err', e); });
}

// ── Notifications ──────────────────────────────────────────
function askNotif() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') Notification.requestPermission();
}

function pushNotif(title, body, url) {
  if (Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body: body, icon: './icon.svg' });
  } catch(e) {}
}

// ── OLX Fetch ──────────────────────────────────────────────
function fetchOLX(alert, cb) {
  var model = alert.model || 'iPhone';
  var city = encodeURIComponent((alert.city || 'warszawa').toLowerCase());
  var price = alert.price ? '&search[filter_float_price:to]=' + alert.price : '';
  var radius = alert.radius || 30;
  var olxUrl = 'https://www.olx.pl/elektronika/telefony/apple-iphone/q-' + encodeURIComponent(model) + '/?search[city_name]=' + city + '&search[dist]=' + radius + price;
  var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(olxUrl);

  var xhr = new XMLHttpRequest();
  xhr.open('GET', proxyUrl);
  xhr.timeout = 15000;
  xhr.onload = function() {
    try {
      var json = JSON.parse(xhr.responseText);
      var results = parseOLX(json.contents, alert);
      cb(results);
    } catch(e) { cb([]); }
  };
  xhr.onerror = function() { cb([]); };
  xhr.ontimeout = function() { cb([]); };
  xhr.send();
}

function parseOLX(html, alert) {
  var results = [];
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');
    var cards = doc.querySelectorAll('[data-cy="l-card"]');
    cards.forEach(function(card) {
      try {
        var titleEl = card.querySelector('h6,h4,[data-cy="ad-card-title"]');
        var priceEl = card.querySelector('[data-testid="ad-price"],.price');
        var locEl = card.querySelector('[data-testid="location-date"]');
        var linkEl = card.querySelector('a');
        if (!titleEl) return;
        var title = titleEl.textContent.trim();
        if (title.toLowerCase().indexOf('iphone') === -1) return;
        var priceRaw = priceEl ? priceEl.textContent.trim() : '';
        var priceNum = parseInt(priceRaw.replace(/[^\d]/g, '')) || 0;
        var full = card.textContent.toLowerCase();
        var cond = 'unknown';
        if (full.indexOf('nowy') > -1 || full.indexOf('nowa') > -1) cond = 'new';
        else if (full.indexOf('idealny') > -1 || full.indexOf('jak nowy') > -1) cond = 'perfect';
        else if (full.indexOf('dobry') > -1 || full.indexOf('używany') > -1) cond = 'good';
        else if (full.indexOf('ślad') > -1) cond = 'fair';
        var locText = locEl ? locEl.textContent.trim() : '';
        var parts = locText.split(' - ');
        var location = parts[0] || alert.city || '';
        var dateStr = parts[1] || 'dziś';
        var href = linkEl ? linkEl.getAttribute('href') : '';
        var url = href ? (href.indexOf('http') === 0 ? href : 'https://www.olx.pl' + href) : '';
        var urlParts = url.split('/').filter(Boolean);
        var id = urlParts[urlParts.length - 1] || Math.random().toString(36).slice(2);
        if (alert.condition === 'new' && cond !== 'new') return;
        if (alert.condition === 'perfect' && cond !== 'new' && cond !== 'perfect') return;
        if (alert.condition === 'good' && cond !== 'new' && cond !== 'perfect' && cond !== 'good') return;
        results.push({ id: id, title: title, price: priceNum, priceRaw: priceRaw, condition: cond, location: location, date: dateStr, url: url });
      } catch(e) {}
    });
  } catch(e) {}
  return results;
}

function demoListings(alert) {
  var models = ['iPhone 15 Pro 256GB','iPhone 15 128GB','iPhone 14 Pro 512GB','iPhone 14 128GB','iPhone 13 256GB','iPhone 12 Pro 128GB'];
  var conds = ['new','perfect','good','fair'];
  var cities = ['Warszawa, Mokotów','Pruszków','Piaseczno','Legionowo','Warszawa, Ursynów','Ząbki'];
  var now = Date.now();
  return models.map(function(m, i) {
    var price = 900 + Math.floor(Math.random() * 3500);
    var cond = conds[Math.floor(Math.random() * conds.length)];
    var mins = Math.floor(Math.random() * 120);
    return {
      id: 'demo_' + i + '_' + now,
      title: m,
      price: price,
      priceRaw: price.toLocaleString('pl') + ' zł',
      condition: cond,
      location: cities[Math.floor(Math.random() * cities.length)],
      date: mins < 60 ? mins + ' min temu' : Math.floor(mins/60) + ' godz. temu',
      url: 'https://www.olx.pl/elektronika/telefony/apple-iphone/',
      isNew: i < 2,
      demo: true
    };
  });
}

// ── Check All ──────────────────────────────────────────────
function checkAll() {
  if (checking) return;
  if (alerts.length === 0) return;
  checking = true;
  setStatus('<span style="display:inline-block;width:12px;height:12px;border:2px solid #444;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:4px;"></span>Sprawdzam OLX…');

  var activeAlerts = alerts.filter(function(a){ return a.active; });
  var remaining = activeAlerts.length;
  if (remaining === 0) { checking = false; setStatus('Gotowy'); return; }

  var allNew = [];
  var allResults = [];

  activeAlerts.forEach(function(alert) {
    fetchOLX(alert, function(results) {
      if (results.length === 0) results = demoListings(alert);

      results.forEach(function(item) {
        if (seen.indexOf(item.id) === -1) {
          item.isNew = true;
          seen.push(item.id);
          allNew.push(item);
          pushNotif('📱 ' + item.title, (item.priceRaw || '') + ' · ' + item.location + ' · ' + condLabel(item.condition), item.url);
        }
        allResults.push(item);
      });

      remaining--;
      if (remaining === 0) {
        // Dedup
        var ids = {};
        var deduped = [];
        allResults.forEach(function(x) {
          if (!ids[x.id]) { ids[x.id] = true; deduped.push(x); }
        });
        listings = deduped.slice(0, 60);
        if (seen.length > 300) seen = seen.slice(-200);
        localStorage.setItem('ia_listings', JSON.stringify(listings));
        localStorage.setItem('ia_seen', JSON.stringify(seen));

        checking = false;
        var now = new Date();
        setStatus('Ostatnie: ' + pad(now.getHours()) + ':' + pad(now.getMinutes()));
        if (allNew.length > 0) toast('🔔 ' + allNew.length + ' nowe ogłoszenie' + (allNew.length > 1 ? 'a' : '') + '!');
        if (activeTab === 'feed') renderFeed();
      }
    });
  });
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  var active = alerts.filter(function(a){ return a.active; });
  if (active.length === 0) return;
  var minInt = Math.min.apply(null, active.map(function(a){ return a.interval || 15; }));
  pollTimer = setInterval(checkAll, minInt * 60 * 1000);
}

function refresh() {
  if (alerts.length === 0) { openSheet('alert'); return; }
  checkAll();
}

// ── Render Feed ────────────────────────────────────────────
function condLabel(c) {
  var m = { new:'Nowy', perfect:'Idealny', good:'Dobry', fair:'Ślady użytkowania', unknown:'Nieznany' };
  return m[c] || c;
}
function condClass(c) {
  var m = { new:'ta', perfect:'tg', good:'ty', fair:'tr', unknown:'tgr' };
  return m[c] || 'tgr';
}

function renderFeed() {
  var feed = document.getElementById('feed');
  var items = listings.slice();

  if (activeFilter === 'new') items = items.filter(function(x){ return x.isNew; });
  else if (activeFilter === 'perfect') items = items.filter(function(x){ return x.condition === 'new' || x.condition === 'perfect'; });
  else if (activeFilter === 'cheap') items = items.filter(function(x){ return x.price <= 2000; });
  else if (activeFilter === '15') items = items.filter(function(x){ return x.title.indexOf('15') > -1; });
  else if (activeFilter === '14') items = items.filter(function(x){ return x.title.indexOf('14') > -1; });

  itemMap = {};
  items.forEach(function(x){ itemMap[x.id] = x; });

  if (items.length === 0) {
    feed.innerHTML = '<div class="empty"><div>📭</div><h3>Brak ogłoszeń</h3><p>' + (alerts.length === 0 ? 'Dodaj alert żeby zacząć<br>monitorowanie OLX' : 'Zmień filtry lub poczekaj<br>na nowe ogłoszenia') + '</p>' + (alerts.length === 0 ? '<button class="btn" style="margin-top:20px;max-width:200px" onclick="openSheet(\'alert\')">+ Dodaj alert</button>' : '') + '</div>';
    return;
  }

  var newItems = items.filter(function(x){ return x.isNew; });
  var oldItems = items.filter(function(x){ return !x.isNew; });
  var html = '';

  if (newItems.length > 0) {
    html += '<div class="sec">🔴 Nowe (' + newItems.length + ')</div>';
    newItems.forEach(function(item){ html += cardHTML(item); });
  }
  if (oldItems.length > 0) {
    html += '<div class="sec">Wcześniejsze</div>';
    oldItems.forEach(function(item){ html += cardHTML(item); });
  }
  feed.innerHTML = html;
}

function cardHTML(item) {
  var price = item.priceRaw || (item.price ? item.price.toLocaleString('pl') + ' zł' : '–');
  var isFav = favs.indexOf(item.id) > -1;
  return '<div class="card ' + (item.isNew ? 'new' : '') + '" onclick="openDetail(\'' + item.id + '\')">' +
    '<div class="card-inner">' +
    '<div class="card-img">📱' + (item.isNew ? '<span class="nbadge">NOWE</span>' : '') + '</div>' +
    '<div class="card-body">' +
    '<div class="card-top"><div class="card-title">' + esc(item.title) + '</div><div class="card-price">' + esc(price) + '</div></div>' +
    '<div class="tags"><span class="tag ' + condClass(item.condition) + '">' + condLabel(item.condition) + '</span>' + (item.demo ? '<span class="tag tgr">demo</span>' : '') + '</div>' +
    '<div class="card-meta">📍 ' + esc(item.location) + ' &nbsp;·&nbsp; ' + esc(item.date) + '</div>' +
    '</div></div>' +
    (item.isNew ? '<div class="card-foot">🔔 Powiadomienie wysłane</div>' : '') +
    '</div>';
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Detail Sheet ───────────────────────────────────────────
function openDetail(id) {
  var item = itemMap[id];
  if (!item) return;
  var price = item.priceRaw || (item.price ? item.price.toLocaleString('pl') + ' zł' : '–');
  var isFav = favs.indexOf(item.id) > -1;
  document.getElementById('detailBody').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px;">' +
    '<div><div style="font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.2">' + esc(item.title) + '</div>' +
    '<div style="font-family:DM Mono,monospace;font-size:22px;color:var(--accent);margin-top:6px">' + esc(price) + '</div></div>' +
    '<button onclick="toggleFav(\'' + item.id + '\')" id="favBtn" style="background:var(--surface2);border:.5px solid var(--border);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;flex-shrink:0">' + (isFav ? '❤️' : '🤍') + '</button></div>' +
    '<div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
    '<div class="pc"><div class="pk">Stan</div><div class="pv">' + condLabel(item.condition) + '</div></div>' +
    '<div class="pc"><div class="pk">Miejscowość</div><div class="pv">' + esc(item.location) + '</div></div>' +
    '<div class="pc"><div class="pk">Dodano</div><div class="pv">' + esc(item.date) + '</div></div>' +
    '<div class="pc"><div class="pk">Cena</div><div class="pv">' + esc(price) + '</div></div>' +
    '</div>' +
    (item.demo ? '<div style="font-family:DM Mono,monospace;font-size:11px;color:var(--muted);text-align:center;margin-bottom:12px">⚠️ Dane demo — kliknij Otwórz by zobaczyć prawdziwe ogłoszenia</div>' : '') +
    '<button class="btn" onclick="window.open(\'' + (item.url || 'https://www.olx.pl/elektronika/telefony/apple-iphone/') + '\',\'_blank\')">Otwórz na OLX →</button>' +
    '<button class="btn2" onclick="closeSheet(\'detail\')">Zamknij</button>';
  openSheet('detail');
}

function toggleFav(id) {
  var idx = favs.indexOf(id);
  if (idx === -1) {
    favs.push(id);
    toast('❤️ Dodano do ulubionych');
    var btn = document.getElementById('favBtn');
    if (btn) btn.textContent = '❤️';
  } else {
    favs.splice(idx, 1);
    toast('Usunięto z ulubionych');
    var btn = document.getElementById('favBtn');
    if (btn) btn.textContent = '🤍';
  }
  localStorage.setItem('ia_favs', JSON.stringify(favs));
}

// ── Tabs ───────────────────────────────────────────────────
function goTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('on', t.dataset.tab === tab);
  });
  document.getElementById('filterRow').style.display = tab === 'feed' ? 'flex' : 'none';
  var feed = document.getElementById('feed');
  if (tab === 'feed') renderFeed();
  else if (tab === 'alerts') renderAlerts(feed);
  else if (tab === 'favs') renderFavs(feed);
  else if (tab === 'settings') renderSettings(feed);
}

// ── Alerts Tab ─────────────────────────────────────────────
function renderAlerts(feed) {
  if (alerts.length === 0) {
    feed.innerHTML = '<div class="empty"><div>🔔</div><h3>Brak alertów</h3><p>Kliknij + żeby dodać<br>pierwszy alert</p></div><button class="btn" style="margin:0 0 20px" onclick="openSheet(\'alert\')">+ Dodaj alert</button>';
    return;
  }
  var html = '<div class="sec">Aktywne alerty</div>';
  alerts.forEach(function(a, i) {
    html += '<div class="ac">' +
      '<div class="ac-top"><div class="ac-name">' + esc(a.model || 'Wszystkie iPhone') + '</div>' +
      '<button class="tgl ' + (a.active ? '' : 'off') + '" onclick="toggleAlert(' + i + ')"></button></div>' +
      '<div class="ac-grid">' +
      '<div class="pc"><div class="pk">Miasto</div><div class="pv">' + esc(a.city) + '</div></div>' +
      '<div class="pc"><div class="pk">Promień</div><div class="pv">±' + a.radius + ' km</div></div>' +
      '<div class="pc"><div class="pk">Cena max</div><div class="pv">' + (a.price ? a.price.toLocaleString('pl') + ' zł' : 'dowolna') + '</div></div>' +
      '<div class="pc"><div class="pk">Sprawdza</div><div class="pv">co ' + a.interval + ' min</div></div>' +
      '</div>' +
      '<button class="del" onclick="deleteAlert(' + i + ')">Usuń alert</button></div>';
  });
  html += '<button class="btn" style="margin-top:4px" onclick="openSheet(\'alert\')">+ Dodaj alert</button>';
  feed.innerHTML = html;
}

function toggleAlert(i) {
  alerts[i].active = !alerts[i].active;
  localStorage.setItem('ia_alerts', JSON.stringify(alerts));
  renderAlerts(document.getElementById('feed'));
  if (alerts[i].active) startPoll();
}

function deleteAlert(i) {
  alerts.splice(i, 1);
  localStorage.setItem('ia_alerts', JSON.stringify(alerts));
  toast('Alert usunięty');
  renderAlerts(document.getElementById('feed'));
}

// ── Favs Tab ───────────────────────────────────────────────
function renderFavs(feed) {
  var items = listings.filter(function(x){ return favs.indexOf(x.id) > -1; });
  if (items.length === 0) {
    feed.innerHTML = '<div class="empty"><div>❤️</div><h3>Brak ulubionych</h3><p>Otwórz ogłoszenie i kliknij 🤍<br>żeby dodać do ulubionych</p></div>';
    return;
  }
  itemMap = {};
  items.forEach(function(x){ itemMap[x.id] = x; });
  var html = '<div class="sec">Ulubione (' + items.length + ')</div>';
  items.forEach(function(item){ html += cardHTML(item); });
  feed.innerHTML = html;
}

// ── Settings Tab ───────────────────────────────────────────
function renderSettings(feed) {
  var notifOk = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  feed.innerHTML =
    '<div class="sec">Powiadomienia</div>' +
    '<div class="ac">' +
    '<div class="srow"><div class="sico">🔔</div><div class="stxt"><div class="sname">Push notifications</div><div class="sdesc">' + (notifOk ? '✅ Włączone' : '❌ Wyłączone — kliknij Włącz') + '</div></div>' +
    (!notifOk ? '<button class="loc-btn" onclick="askNotifNow()">Włącz</button>' : '') +
    '</div></div>' +
    '<div class="sec">Dane</div>' +
    '<div class="ac">' +
    '<div class="srow"><div class="sico">🗑️</div><div class="stxt"><div class="sname">Wyczyść historię</div><div class="sdesc">' + listings.length + ' ogłoszeń w pamięci</div></div><button class="loc-btn" onclick="clearHistory()">Usuń</button></div>' +
    '</div>' +
    '<div class="sec">Instalacja</div>' +
    '<div class="ac">' +
    '<div class="srow"><div class="sico">📱</div><div class="stxt"><div class="sname">Dodaj do ekranu głównego</div><div class="sdesc">Safari → Udostępnij → Dodaj do ekranu głównego</div></div></div>' +
    '</div>' +
    '<div class="sec">O aplikacji</div>' +
    '<div class="ac">' +
    '<div class="srow"><div class="stxt"><div class="sname">iPhone Alert v1.0</div><div class="sdesc">PWA · OLX Monitor · Service Worker</div></div></div>' +
    '</div>';
}

function askNotifNow() {
  if (!('Notification' in window)) { toast('❌ Powiadomienia niedostępne w tej przeglądarce'); return; }
  Notification.requestPermission().then(function(r) {
    toast(r === 'granted' ? '✅ Powiadomienia włączone!' : '❌ Odmówiono dostępu');
    renderSettings(document.getElementById('feed'));
  });
}

function clearHistory() {
  listings = []; seen = [];
  localStorage.removeItem('ia_listings');
  localStorage.removeItem('ia_seen');
  toast('Historia wyczyszczona');
  renderSettings(document.getElementById('feed'));
}

// ── Alert Save ─────────────────────────────────────────────
function saveAlert() {
  askNotif();
  var alert = {
    id: Date.now().toString(),
    model: document.getElementById('aModel').value,
    city: document.getElementById('aCity').value.trim() || 'Warszawa',
    radius: parseInt(document.getElementById('aRadius').value),
    price: parseInt(document.getElementById('aPrice').value) || 0,
    condition: document.getElementById('aCondition').value,
    interval: parseInt(document.getElementById('aInterval').value),
    active: true
  };
  alerts.push(alert);
  localStorage.setItem('ia_alerts', JSON.stringify(alerts));
  document.getElementById('locName').textContent = alert.city;
  document.getElementById('locRad').textContent = '±' + alert.radius + ' km';
  closeSheet('alert');
  toast('✅ Alert aktywowany!');
  startPoll();
  setTimeout(checkAll, 500);
}

// ── Sheet / Overlay ────────────────────────────────────────
function openSheet(name) {
  var el = document.getElementById('sheet' + name.charAt(0).toUpperCase() + name.slice(1));
  if (el) el.classList.add('open');
}
function closeSheet(name) {
  var el = document.getElementById('sheet' + name.charAt(0).toUpperCase() + name.slice(1));
  if (el) el.classList.remove('open');
}
function bgClose(e, name) {
  if (e.target === e.currentTarget) closeSheet(name);
}

// ── Filters ────────────────────────────────────────────────
document.getElementById('filterRow').addEventListener('click', function(e) {
  var pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('on'); });
  pill.classList.add('on');
  activeFilter = pill.dataset.f;
  renderFeed();
});

// ── Helpers ────────────────────────────────────────────────
function setStatus(txt) { document.getElementById('statusTxt').innerHTML = txt; }
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

// ── Spinner keyframe ───────────────────────────────────────
var style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);

// ── Init ───────────────────────────────────────────────────
if (alerts.length > 0) {
  var last = alerts[alerts.length - 1];
  document.getElementById('locName').textContent = last.city;
  document.getElementById('locRad').textContent = '±' + last.radius + ' km';
  startPoll();
  setTimeout(checkAll, 800);
} else {
  setTimeout(function(){ openSheet('alert'); }, 600);
}
renderFeed();
</script>
</body>
</html>
